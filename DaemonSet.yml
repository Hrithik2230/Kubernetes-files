---

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: httpd-daemon
  labels:
    type: webserver
    author: HRK
spec:
  selector:
    matchLabels:
      type: webserver
  template:
    metadata:
      name: httpd-pod
      labels:
        type: webserver
    spec:
     containers:
       - name: httpd-container
         image: httpd
         ports:
          - containerPort: 80
            hostPort: 8080     

