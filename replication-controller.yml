---

apiVersion: v1
kind: ReplicationController
metadata:
  name: httd-rc
  labels:
    author: Hrk
    type: webserver
spec:
  replicas: 3
  template:
    metadata:
      name: httpd-pod
      labels:
       type: webserver
    spec:
      containers:
        - name: httpd-container
          image: httpd
          ports:
            - containerPort: 80
              hostPort: 1234
...
