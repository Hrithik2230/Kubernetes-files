---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
  labels:
   author: Hrk
   type: db
spec:
  replicas: 2
  selector:
    matchLabels:
      type: db
  template:
    metadata:
      name: mysql-pod
      labels:
        type: db
    spec:
      containers:
        - name: mysql-container
          image: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "123456"
