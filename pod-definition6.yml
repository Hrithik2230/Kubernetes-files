---

apiVersion: v1
kind: Pod
metadata:
  name: mysql-pod
  labels:
    type: db
    author: Hrithik
spec:
  containers:
    - name: mysql-container
      image: mysql:5
      env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
             name: mysql-secret
             key: a
