---

version: '3'
services:
  voting-app:
    image: dockersamples/examplevotingapp_vote
    ports:
      - 8080:80
    deploy:
      replicas: 2
  redis-db:
    image: redis
    ports:
      - 6379:6379
  worker-app:
    image: dockersamples/examplevotingapp_worker
  postgres-db:
    image: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: Hrithik
      POSTGRES_USER: Hrithik
      POSTGRES_DB: mydb
  results-app:
    image: dockersamples/examplevotingapp_result
    ports:
      - 7070:80
    deploy:
      replicas: 2
...

